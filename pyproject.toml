[project]
name = "yt-word-search"
version = "0.1.0"
description = "Recherche de mots dans les sous-titres d'une chaine YouTube (privacy-first, FLOSS)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "yt-word-search contributors" }]
keywords = ["youtube", "subtitles", "transcript", "search", "sqlite", "fts5", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.scripts]
yts = "yt_search.cli:main"

[project.urls]
Homepage = "https://github.com/goheakan/yt-word-search"
Source = "https://github.com/goheakan/yt-word-search"
Issues = "https://github.com/goheakan/yt-word-search/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_search"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
